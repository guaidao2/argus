code: en
name: English
messages:
  # ---------------------------------------------------------------- program
  app.tagline: "modern port scanner built for offensive security"
  app.description: |-
    Argus is a cross-platform TCP/UDP port scanner designed for offensive
    security work. It ships as a single static binary, produces
    nmap-compatible output and is extended through YAML plugins.
  app.authors: "Authors"
  app.license: "License"
  app.homepage: "Homepage"
  app.bullet: "  - %s"
  app.legal: |-
    Legal notice: only scan systems you own or have explicit written
    authorization to test. Unauthorized port scanning can be illegal.

  # ------------------------------------------------------------------- help
  help.usage: "Usage: %s [options] <target ...>"
  help.section.targets: "TARGET SPECIFICATION"
  help.section.scan: "SCAN TECHNIQUES"
  help.section.detect: "SERVICE AND VERSION DETECTION"
  help.section.timing: "TIMING AND PERFORMANCE"
  help.section.output: "OUTPUT"
  help.section.plugins: "PLUGINS"
  help.section.misc: "MISC"
  help.examples: "EXAMPLES"
  help.langs_available: "available languages: %s"
  help.more_info: "see --help for the full option list"

  # ------------------------------------------------------------------ flags
  flag.lang: "output language: en (default) or zh; --lang zh enables Simplified Chinese"
  flag.list_langs: "list available output languages and exit"
  flag.help: "print this help and exit"
  flag.version: "print version information and exit"

  flag.targets.positional: "targets such as 10.0.0.1, 10.0.0.0/24, 10.0.0.1-50, 10.0.0.1-10.0.0.20, host.example.com, 2001:db8::1"
  flag.input_list: "read targets from file (- for stdin), one per line, '#' comments allowed"
  flag.exclude: "comma-separated targets to exclude"
  flag.exclude_file: "read excluded targets from file"
  flag.no_dns: "never resolve names or perform reverse lookups"
  flag.resolve_all: "always resolve every target name, even with -Pn"

  flag.ports: "ports to scan: 22,80,443; 1-1024; -65000; T:80,U:53; a service name like http; use '-' for all 65535"
  flag.top_ports: "scan the N most common ports from the built-in table (that table is smaller than nmap's top 1000; use -p- for a full 65535-port sweep)"
  flag.fast: "scan only the 100 most common ports (shorthand for --top-ports 100)"
  flag.exclude_ports: "ports to remove from the scan set, same syntax as -p"
  flag.sequential: "scan ports in ascending order instead of randomised order"
  flag.scan_type: "scan technique: connect (default, no privileges), syn (Linux raw sockets, needs CAP_NET_RAW), or auto (probe the environment at startup and pick)"
  flag.pn: "treat all hosts as online, skip host discovery"
  flag.udp: "add a UDP scan of the selected UDP ports (needs no privileges on Linux; other platforms may differ)"
  flag.syn_privileges: "SYN scanning needs root or cap_net_raw; argus never silently degrades to connect"

  flag.service: "probe open ports to identify service and version (-sV)"
  flag.banner: "always grab a raw banner, even without -sV"
  flag.probe_timeout: "per-probe timeout for service detection"
  flag.findings: "run intrusive checks that report conclusions: unauthenticated access, exposed admin interfaces, vulnerable builds"

  flag.timing: "timing template 0-5 (0 paranoid .. 3 normal(default) .. 5 insane)"
  flag.min_rate: "send no less than this many probes per second"
  flag.max_rate: "send no more than this many probes per second"
  flag.min_parallel: "minimum number of parallel probes"
  flag.max_parallel: "maximum number of parallel probes"
  flag.max_retries: "retries for a probe with no response (default 2)"
  flag.host_timeout: "give up on a host after this much time (0 disables)"
  flag.timeout: "initial probe timeout (default is set by -T)"
  flag.scan_delay: "pause between probes to the same host (e.g. 1s, 500ms)"

  flag.output_normal: "write nmap-style normal output to file"
  flag.output_xml: "write nmap-compatible XML to file (-oX)"
  flag.output_json: "write JSON findings to file; --jsonl emits one host per line (-oJ)"
  flag.output_all: "write all formats at once using this output base name (-oA)"
  flag.append: "append to the output files instead of overwriting"
  flag.jsonl: "emit JSON Lines (one host per line) instead of a single JSON document"
  flag.open_only: "only show open ports"
  flag.reason: "show why each port is in its state (syn-ack, conn-refused, ...)"
  flag.hack_reason: "show common offensive-security angles for each detected port"
  flag.verbose: "increase verbosity (-v, -vv)"
  flag.debug: "debug level, implies -vv"
  flag.no_color: "disable colour output (also honours NO_COLOR)"
  flag.stats_every: "print progress to stderr this often (e.g. 5s, 0 disables)"

  flag.register_plugin: "validate and register a plugin file or directory, remembering its absolute path"
  flag.unregister_plugin: "remove a plugin from the registry by name or path ('--all' removes everything)"
  flag.list_plugins: "show the registered plugins and their state"
  flag.plugin_dir: "load plugins from this path for one run, ignoring the registry"
  flag.no_plugins: "run with no plugins at all"
  flag.plugin_var: "plugin parameter, repeatable (key=value)"
  flag.strict_plugins: "fail instead of warning when a registered plugin is missing or changed"

  # ------------------------------------------------------------- errors etc
  err.usage: "Try '%s --help' for the option list."
  err.no_targets: "no targets given"
  err.bad_target: "invalid target %q: %v"
  err.bad_ports: "invalid port specification %q: %v"
  err.bad_timing: "invalid timing template %d, expected 0-5"
  err.bad_duration: "invalid duration %q"
  err.bad_rate: "invalid rate %q"
  err.read_file: "cannot read %s: %v"
  err.open_output: "cannot open output file %s: %v"
  err.unknown_lang: "unknown language %q, using English (available: %s)"
  err.no_ports: "no ports selected"
  err.unknown_state: "internal error: unknown port state %q"
  err.scan_failed: "scan failed: %v"
  err.hash: "cannot hash %s: %v"
  err.resize_not_supported: "not supported"

  err.syn_platform: "SYN scan is unavailable on %s/%s: this build has no raw-socket support for it"
  err.syn_platform_hint: "use --scan-type connect, or build argus on Linux where raw sockets are implemented in pure Go"
  err.syn_privileges: "SYN scan needs raw socket privileges: %v"
  err.syn_privileges_hint: "run as root, or grant the capability once with: sudo setcap cap_net_raw+ep $(command -v argus)"
  err.udp_privileges: "UDP scan needs raw socket privileges: %v"
  err.udp_select: "no UDP ports selected; use -p U:53,161 or --udp to scan the UDP side of the chosen ports"

  err.plugin_no_path: "plugin path does not exist: %s"
  err.plugin_empty_dir: "no plugin files (*.yaml, *.yml) in %s"
  err.plugin_bad: "cannot load plugin %s: %v"
  err.plugin_bad_api: "plugin %s uses unsupported apiVersion %q (this build understands %s)"
  err.plugin_needs_newer: "plugin %s needs argus >= %s, running %s"
  err.plugin_not_found: "no registered plugin matches %q"
  err.plugin_ambiguous: "%q matches several registered plugins: %s"
  err.plugin_dupe_name: "plugin name %q is already registered from %s"

  warn.plugin_missing: "registered plugin %s is gone from disk (%s), skipping it"
  warn.plugin_fallback: "argus falls back to running without that plugin; re-run --register-plugin with a new path to repair the registry"
  warn.plugin_changed: "plugin %s (%s) changed on disk since registration (sha256 mismatch), loading it anyway"
  warn.plugin_strict: "stopping because --strict-plugins is set"
  warn.plugin_override: "plugin %s overrides the built-in %s %q"
  warn.registry_insecure: "plugin registry %s is group/world-writable: %s"
  warn.registry_insecure_root: "argus runs as root, so a local user could inject plugin data that root then loads"
  warn.proxy_tcp_only: "--proxy applies to TCP connect scans only; SYN and UDP probes stay direct"
  warn.many_targets: "%d targets to scan, this can take a long time (Ctrl-C aborts and keeps partial results)"
  warn.bad_cidr: "ignoring %q: %v"
  warn.plugin_var_unused: "plugin variable %q was not used by any loaded plugin"
  warn.append_unsupported: "%s output cannot be appended to without producing a file no parser can read; rewriting %s"
  warn.plugin_var_no_plugin: "--plugin-var given but no plugin defines a 'vars' section"

  info.state_dir: "state directory: %s"
  info.plugins_none: "no plugins registered"
  info.plugin_registered: "registered plugin %s -> %s"
  info.plugin_updated: "updated plugin %s: %s -> %s"
  info.plugin_unregistered: "unregistered plugin %s (%s)"
  info.plugin_unregistered_all: "unregistered %d plugin(s)"
  info.plugin_none_removed: "nothing matched, registry unchanged"
  info.plugins_loaded: "loaded %d plugin(s), %d fingerprint rule(s), %d hack-reason entr(ies)"
  info.plugin_no_content: "plugin %s defines no fingerprints or hack reasons"
  info.plugin_skipped: "skipped %s: %s"
  warn.plugin_skipped: "not a plugin document, skipping: %s (%s)"
  info.registry_table_header: "NAME\tKIND\tSTATE\tPATH\tREGISTERED"
  info.registry_state_ok: "ok"
  info.registry_state_missing: "MISSING"
  info.registry_state_changed: "CHANGED"

  # ---------------------------------------------------------------- reports
  report.starting: "Starting Argus %s by %s ( %s ) at %s"
  report.report_for: "Argus scan report for %s"
  report.host_up: "Host is up (%ss latency)."
  report.host_down: "Host seems down."
  report.not_shown: "Not shown: %s"
  report.extraports: "%d %s %s ports (%s)"
  report.port_line: "%-8s %-6s %-9s %s"
  report.col_port: "PORT"
  report.col_state: "STATE"
  report.col_service: "SERVICE"
  report.col_version: "VERSION"
  report.no_ports: "No ports scanned for this host."
  report.interrupted: "QUITTING! (partial results below)"
  report.done: "Argus done: %d %s (%d %s up) scanned in %.2f seconds"
  report.host_header: "Argus scan report for %s (%s)"
  report.reason_annotation: "  [%s]"

  report.finding: "check: %s [%s]"
  report.finding_refs: "refs: %s"
  report.hack_reason: "hack-reason: %s"
  report.hack_point: "| %s"
  report.hack_last_point: "|_%s"
  report.hack_tools: "tools: %s"
  report.hack_refs: "refs: %s"
  report.service_banner: "banner: %s"
  report.tls_cert_subject: "ssl-cert: subject=%s"
  report.tls_cert_issuer: "issuer=%s"
  report.tls_not_valid_before: "not valid before: %s"
  report.tls_not_valid_after: "not valid after: %s"
  report.tls_san: "subject alternative name: %s"
  report.tls_self_signed: "WARNING: certificate is self-signed"
  report.tls_expired: "WARNING: certificate has expired"
  report.service_info_extra: "(%s)"

  unit.second: "second"
  unit.seconds: "seconds"
  unit.host: "host"
  unit.hosts: "hosts"
  unit.ip_address: "IP address"
  unit.ip_addresses: "IP addresses"
  unit.closed: "closed"
  unit.open: "open"
  unit.filtered: "filtered"
  unit.unfiltered: "unfiltered"
  unit.open_filtered: "open|filtered"
  unit.closed_filtered: "closed|filtered"

  prefix.warning: "WARNING: "
  prefix.error: "ERROR: "
  prefix.debug: "DEBUG: "
  report.host_down_hint: "If the host is really up but filtering our probes, retry with -Pn."
  flag.proxy: "route TCP connect probes through a SOCKS5 proxy, e.g. socks5://127.0.0.1:1080"
  info.progress: "scanned %d/%d ports (%d%%)"
  info.scan_type_auto: "auto scan technique: %s (%s)"
  info.checks_enabled: "intrusive checks enabled: %d check rule(s) loaded"
  err.bad_scan_type: "unknown scan type %q, expected connect, syn or auto"
  err.no_targets_after_exclude: "every target was excluded, nothing left to scan"
  err.top_ports_too_large: "--top-ports %d exceeds the built-in table (%d entries); use -p- for a full sweep"
  err.plugin_mode_conflict: "--register-plugin cannot be combined with --unregister-plugin or --list-plugins"
  err.plugin_registry_read: "cannot read the plugin registry: %v"
  err.plugin_registry_write: "cannot write the plugin registry: %v"
  warn.plugin_missing_summary: "%d registered plugin(s) are missing from disk"
  warn.plugin_var_malformed: "ignoring --plugin-var %q: expected key=value"
  report.extraports_one: "%d %s %s port (%s)"
  report.down_summary: "Note: %d host(s) seem down. If they are really up but filtering our probes, retry with -Pn."
  report.technique_syn: "Scan technique: SYN scan (raw sockets, half open)"
  report.technique_connect: "Scan technique: TCP connect (full handshake)"
  report.technique_syn_mixed: "Scan technique: SYN scan (raw sockets, half open); loopback and local addresses are probed with TCP connect"
  report.technique_note: "Scan technique: TCP connect (%s)"
  report.technique_auto_note: "Scan technique: TCP connect (auto-selected: %s)"
  report.technique_auto_syn: "Scan technique: SYN scan (raw sockets, half open; auto-selected)"
  report.technique_auto_mixed: "Scan technique: SYN scan (raw sockets, auto-selected); loopback and local addresses are probed with TCP connect"
  flag.fallback_connect: "fall back to a TCP connect scan when the requested SYN scan cannot run, and state it in the report"
  warn.scan_type_fallback: "SYN scan is unavailable (%s); falling back to TCP connect because --fallback-connect is set"
  reason.syn_unsupported: "this build has no raw socket support for this platform"
  reason.local_targets: "these targets are local addresses"
  reason.syn_privileges: "no raw socket privileges"
  reason.syn_no_reply: "the raw socket received no reply in the preflight"
  err.syn_no_reply: "the SYN scan preflight got no reply: the raw socket can send but nothing came back"
  err.syn_no_reply_hint: "check for a local firewall, a BPF filter or a restricted container network namespace dropping loopback traffic; use --scan-type connect to scan anyway, or --fallback-connect to let argus decide"
