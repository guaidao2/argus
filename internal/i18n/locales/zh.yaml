code: zh
name: 简体中文
messages:
  # ---------------------------------------------------------------- program
  app.tagline: "面向渗透测试的现代化端口扫描器"
  app.description: |-
    Argus 是一款跨平台的 TCP/UDP 端口扫描器，面向渗透测试场景设计。
    它以单个静态二进制文件交付，输出兼容 nmap，并可通过 YAML 插件扩展。
  app.authors: "作者"
  app.license: "许可证"
  app.homepage: "项目主页"
  app.bullet: "  - %s"
  app.legal: |-
    法律提示：请仅扫描你本人拥有、或已获得明确书面授权的系统。
    未经授权的端口扫描在多数司法辖区可能构成违法。

  # ------------------------------------------------------------------- help
