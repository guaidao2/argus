  flag.verbose: "提高输出详细程度（-v、-vv）"
  flag.debug: "调试级别，隐含 -vv"
  flag.no_color: "关闭彩色输出（同样遵循 NO_COLOR 环境变量）"
  flag.stats_every: "按该间隔向标准错误打印进度（如 5s，0 表示关闭）"

