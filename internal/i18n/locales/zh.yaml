  help.section.targets: "目标格式"
  help.section.scan: "扫描方式"
  help.section.detect: "服务与版本识别"
  help.section.timing: "时序与性能"
  help.section.output: "输出"
  help.section.plugins: "插件"
  help.section.misc: "其他"
  help.examples: "示例"
  help.langs_available: "可用语言：%s"
  help.more_info: "完整选项列表请见 --help"

