# Argus built-in service table.
#
# The ORDER of this list is the frequency ranking: the first entry is the port
# most likely to be interesting, and --top-ports N takes the first N entries.
# `-F` is --top-ports 100.
#
# The ordering follows published scan statistics, the same ones nmap's default
# top-1000 sweep is built from, and the service names are IANA registrations.
# The two tools therefore agree on which ports a default scan reaches, which a
# hand-picked list did not: an earlier version of this table covered only 135 of
# those 1000 ports and missed live web ports such as 81, 82 and 5001.
#
# Entries after the top 1000 are ports argus keeps for offensive-security work
# even though they are rare in general scanning. Use `-p-` for all 65535.
