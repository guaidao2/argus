apiVersion: argus.fingerprint/v1
id: generic
description: |
  Fallback rules with no port binding. They apply to every open port and only
  set fields when the service volunteers something that no specific rule
  claimed.

  HTTP identification deliberately does NOT live here. It lives in http.yaml as
  rules without a port list (http-any-port and https-any-port), so there is one
  copy of it. Two copies drifted apart once already: a field added to the
  http.yaml copy never reached this one, and Apache details were extracted on
  port 80 but not on port 82.
rules:
  - id: generic-printable-banner
    description: Any service that greets with printable text
    probes:
      - id: banner
        send: ""
        read_timeout: 800ms
        read_bytes: 512
    matches:
      - id: printable
        pattern: '^[\x20-\x7e][\x20-\x7e\r\n\t]{3,}'
        set: {}
        fields:
          info: '^([^\r\n]{4,120})'
