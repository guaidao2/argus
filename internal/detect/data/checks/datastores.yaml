apiVersion: argus.fingerprint/v1
id: checks-datastores
description: Cache and database exposure checks
rules:
  - id: memcached-unauth
    description: Memcached answers stats without authentication
    kind: check
    ports: [11211, 11212, 11213]
    service: memcached
    probes:
      - id: stats
        send: "stats\r\n"
        read_timeout: 3s
        read_bytes: 8192
    matches:
      # Memcached has no authentication at all, so a stats reply means the
      # cache is open to anyone who can reach the port.
      - id: unauth
        pattern: '(?m)^STAT (version|curr_items|pid|uptime)\b'
        set: {service: memcached, product: memcached}
        finding:
          title:
            en: "Memcached: open instance"
            zh: "Memcached：实例对外开放"
          severity: medium
          description:
            en: "Memcached has no authentication, so every cached value is readable. Cached session identifiers can usually be used to impersonate application users, and an open instance is also an amplification vector."
            zh: "Memcached 本身没有认证机制，因此所有缓存值都可读取。其中的会话标识通常可用于冒充应用用户，开放实例同时也是放大攻击的反射源。"
          refs:
            - "https://memcached.org/"

  - id: mongodb-unauth
    description: MongoDB lists databases without authentication
    kind: check
    ports: [27017, 27018, 27019]
    service: mongodb
    probes:
      # OP_QUERY for {"listDatabases": 1} against admin.$cmd. A server with
      # authorization enabled answers with an authentication error instead.
      - id: list-databases
        send: "?\x00\x00\x00\x01\x00\x00\x00\x00\x00\x00\x00\xd4\x07\x00\x00\x00\x00\x00\x00admin.$cmd\x00\x00\x00\x00\x00\xff\xff\xff\xff\x18\x00\x00\x00\x10listDatabases\x00\x01\x00\x00\x00\x00"
        read_timeout: 4s
        read_bytes: 16384
    matches:
      - id: unauth
        pattern: '(?s)"databases"\s*:\s*\['
        set: {service: mongodb, product: MongoDB}
        finding:
          title:
            en: "MongoDB: unauthenticated database listing"
            zh: "MongoDB：未授权列出数据库"
          severity: high
          description:
            en: "listDatabases succeeded without credentials, so the data is open to anyone who can reach the port."
            zh: "listDatabases 在无凭据情况下执行成功，任何能访问该端口的人都能读取数据。"
          refs:
            - "https://www.mongodb.com/docs/manual/security/"

  - id: couchdb-admin-party
    description: CouchDB lists databases without authentication
    kind: check
    ports: [5984, 5985]
    service: couchdb
    probes:
      - id: all-dbs
        send: "GET /_all_dbs HTTP/1.0\r\nHost: {{host}}\r\nUser-Agent: {{agent}}/{{argus_version}}\r\n\r\n"
        read_timeout: 3s
        read_bytes: 8192
    matches:
      - id: unauth
        pattern: '(?is)^HTTP/1\.[01] 200\b.*\r?\n\r?\n\s*\['
        set: {service: couchdb}
        finding:
          title:
            en: "CouchDB: unauthenticated admin access"
            zh: "CouchDB：未授权管理访问"
          severity: high
          description:
            en: "The database list was returned without credentials. An unconfigured CouchDB treats any client as an administrator, which includes creating and deleting databases."
            zh: "未使用凭据即返回了数据库列表。未配置认证的 CouchDB 会把任何客户端当作管理员，包括创建与删除数据库。"
          refs:
            - "https://docs.couchdb.org/en/stable/setup/security.html"

  - id: rabbitmq-default-creds
    description: RabbitMQ management API accepts the default guest credentials
    kind: check
    ports: [15672, 15671]
    probes:
      - id: overview-guest
        send: "GET /api/overview HTTP/1.0\r\nHost: {{host}}\r\nUser-Agent: {{agent}}/{{argus_version}}\r\nAuthorization: Basic Z3Vlc3Q6Z3Vlc3Q=\r\nAccept: application/json\r\n\r\n"
        read_timeout: 4s
        read_bytes: 8192
    matches:
      - id: unauth
        pattern: '(?is)^HTTP/1\.[01] 200\b.*"rabbitmq_version"'
        set: {service: http, product: RabbitMQ Management}
        finding:
          title:
            en: "RabbitMQ: default management credentials accepted"
            zh: "RabbitMQ：管理接口接受默认凭据"
          severity: high
          description:
            en: "The management API accepted guest/guest. That account is normally restricted to localhost, so this instance has been opened up; queue contents usually carry credentials for the services that publish into them."
            zh: "管理接口接受了 guest/guest。该账户默认只允许本机登录，说明此实例已被放开；队列内容通常包含发布方服务的凭据。"
          refs:
            - "https://www.rabbitmq.com/docs/access-control"
